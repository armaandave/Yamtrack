name: Deploy Backend on Desk Mac

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Git branch to deploy. Leave blank to deploy the selected workflow branch."
        required: false
        default: ""
        type: string
      external_ratings_canary:
        description: "Queue and verify 10 TMDB movies for IMDb and Letterboxd."
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy backend
    runs-on: [self-hosted, spine-backend]
    steps:
      - name: Checkout deploy workflow branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Deploy requested branch
        run: |
          requested_branch="${{ inputs.branch }}"
          branch="${requested_branch:-$GITHUB_REF_NAME}"
          ./scripts/codex-mobile-deploy-backend.sh "$branch"

      - name: Run bounded external-ratings canary
        if: ${{ inputs.external_ratings_canary }}
        run: |
          repo_dir="${SPINE_DEPLOY_DIR:-$HOME/projects/spine-deploy}"
          env_file="${SPINE_DEPLOY_ENV_FILE:-$HOME/projects/spine/.env.production}"
          compose=(docker compose --project-name spine --env-file "$env_file" -f "$repo_dir/docker-compose.production.yml")
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          "${compose[@]}" exec -T redis redis-cli ping
          "${compose[@]}" exec -T app celery -A config inspect ping
          "${compose[@]}" exec -T app python manage.py backfill_external_ratings \
            --rating-source imdb \
            --rating-source letterboxd \
            --media-type movie \
            --item-source tmdb \
            --batch-size 10 \
            --limit 10 \
            --dry-run
          "${compose[@]}" exec -T app python manage.py backfill_external_ratings \
            --rating-source imdb \
            --rating-source letterboxd \
            --media-type movie \
            --item-source tmdb \
            --batch-size 10 \
            --limit 10

          for _ in {1..30}; do
            summary="$("${compose[@]}" logs --since "$started_at" app | grep 'external_rating_batch_summary' | tail -1 || true)"
            if [[ -n "$summary" ]]; then
              echo "$summary"
              "${compose[@]}" exec -T app python manage.py external_rating_status --rating-source imdb --rating-source letterboxd --media-type movie --item-source tmdb
              exit 0
            fi
            sleep 10
          done

          echo "Timed out waiting for external-rating canary summary" >&2
          exit 1
