name: Deploy Backend on Desk Mac

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Git branch to deploy"
        required: true
        default: "myapp-main"
        type: string

jobs:
  deploy:
    name: Deploy backend
    runs-on: [self-hosted, spine-backend]
    steps:
      - name: Deploy requested branch
        run: |
          cd /Users/armaandave/projects/spine
          branch="${{ inputs.branch }}"
          git fetch origin "$branch"
          git checkout "$branch"
          git reset --hard "origin/$branch"
          ./scripts/codex-mobile-deploy-backend.sh "$branch"
